    <style>
      /* Gaegu, the hints' hand: the page's own copy, so the title waits on no one else's server. */
      @font-face { font-family: Gaegu; font-weight: 700; font-display: swap; src: url('/fonts/gaegu-700-latin.woff2') format('woff2'); }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1011; }
      canvas { display: block; cursor: crosshair; }
      /* ?film: no cursor anywhere on the page, whatever the orbit controls set on the canvas. */
      html.film, html.film * { cursor: none !important; }
      /* The goose game: the black his fall goes to and his wake comes up out of. */
      #fallen { position: fixed; inset: 0; pointer-events: none; background: #000; opacity: 0; }
      #readouts {
        position: fixed; top: 8px; left: 10px;
        font: 12px/1.4 ui-monospace, monospace; color: #c9d1cc;
        text-shadow: 0 1px 2px #000; pointer-events: none;
      }
      /* The loading screen, as the ending's title card (gooseoutro.ts): the game's title on black in Gaegu, the hints'
         hand, and under it the share of the scene's pipelines built behind it (main.ts), then its Enter key; at the
         end it fades into the game. Under the ?errors box, which a phone needs to see. */
      #loading {
        position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #000; color: #fff6e4; font: 700 min(13vw, 128px)/1.1 Gaegu, cursive;
        transition: opacity 0.6s ease-out;
      }
      #loading.loaded { opacity: 0; pointer-events: none; }
      /* The share, then the Enter key in its place: one slot as tall as the key, so the title never moves. */
      #loading .slot { height: 64px; margin-top: 12px; display: flex; align-items: flex-start; justify-content: center; }
      #loading .share { font-size: 26px; opacity: 0.6; font-variant-numeric: tabular-nums; }
      /* The key as the hints draw theirs, a rounded box in a thick line sitting on its own shadow: the loading screen's
         Enter, and the ending's play again under its title (main.ts). */
      .enter {
        padding: 2px 22px; font: 700 30px/1.2 Gaegu, cursive; color: #fff6e4; cursor: pointer;
        background: #0007; border: 3px solid #f6ead0; border-radius: 11px; box-shadow: 0 3px 0 #f6ead099;
        transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
      }
      .enter:hover, .enter:focus-visible { background: #f6ead01a; outline: none; }
      .enter:active { transform: translateY(3px); box-shadow: 0 0 0 #f6ead099; }
      /* What the loading screen says when it is stuck, and its key to try again: over the slot's edge, so the title never moves. */
      #loading .trouble { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0 16px; font-size: 26px; text-align: center; }
    </style>
  </head>
  <body>
    <script>
      // `?errors`: the console's errors and warnings written on the page, for a
      // phone, which has no console to read; the first dozen, and of a long one
      // its start and the lines that say what went wrong, not the shader's
      // source. Above them, the GPU's limits a shader can run into.
      if (new URLSearchParams(location.search).has('errors')) {
        const box = document.createElement('pre')
        box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:60%;overflow:auto;margin:0;padding:8px;font:11px/1.3 monospace;color:#ffb0a0;background:#000c;white-space:pre-wrap;z-index:9;display:none'
        const reveal = () => {
          box.style.display = 'block'
          if (!box.isConnected) document.body.append(box)
        }
        let shown = 0
        const show = (kind, args) => {
          if (shown++ >= 12) return
          let text = args.map((a) => (a instanceof Error ? a.stack || a.message : typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ')
          if (text.length > 600) {
            // three marks the line a shader fails on with '>', after the stage's name.
            const telling = text.split('\n').filter((line) => (/material|info log|error|warning|limit|exceed|too many|reason|message|^\s*>|^(VERTEX|FRAGMENT)$/i.test(line) && line.length < 400))
            text = text.slice(0, 300) + '\n  ...\n' + telling.slice(0, 25).join('\n')
          }
          box.textContent += kind + ': ' + text + '\n\n'
          reveal()
        }
        const limits = () => {
          const gl = document.createElement('canvas').getContext('webgl2')
          let line = ''
          if (gl) {
            const names = ['MAX_VERTEX_UNIFORM_VECTORS', 'MAX_FRAGMENT_UNIFORM_VECTORS', 'MAX_VARYING_VECTORS', 'MAX_TEXTURE_IMAGE_UNITS', 'MAX_VERTEX_TEXTURE_IMAGE_UNITS', 'MAX_COMBINED_TEXTURE_IMAGE_UNITS', 'MAX_TEXTURE_SIZE', 'MAX_UNIFORM_BLOCK_SIZE', 'MAX_SAMPLES']
            line += 'webgl2: ' + names.map((n) => n.replace('MAX_', '').toLowerCase() + ' ' + gl.getParameter(gl[n])).join(', ') + '\n'
            const info = gl.getExtension('WEBGL_debug_renderer_info')
            if (info) line += 'gpu: ' + gl.getParameter(info.UNMASKED_RENDERER_WEBGL) + '\n'
            line += 'float render: ' + !!gl.getExtension('EXT_color_buffer_float') + '\n'
          }
          box.textContent = line + box.textContent
          navigator.gpu?.requestAdapter({ featureLevel: 'compatibility' }).then((a) => {
            if (!a) return
            const l = a.limits
            const names = ['maxSamplersPerShaderStage', 'maxSampledTexturesPerShaderStage', 'maxStorageBuffersPerShaderStage', 'maxStorageBuffersInVertexStage', 'maxStorageBuffersInFragmentStage', 'maxStorageTexturesPerShaderStage', 'maxUniformBuffersPerShaderStage', 'maxUniformBufferBindingSize', 'maxTextureDimension2D', 'maxInterStageShaderVariables', 'maxColorAttachments']
            box.textContent = 'webgpu (' + (a.features.has('core-features-and-limits') ? 'core' : 'compatibility') + '): ' + names.filter((n) => n in l).map((n) => n + ' ' + l[n]).join(', ') + '\n' + box.textContent
          })
        }
        limits()
        reveal()
        // A program the driver will not link, with no log to say why: its shaders' sizes,
        // which tell one material from another, and whether each compiled.
        const failed = new Set()
        const parameter = WebGL2RenderingContext.prototype.getProgramParameter
        WebGL2RenderingContext.prototype.getProgramParameter = function (program, name) {
          const value = parameter.call(this, program, name)
          if (name === this.LINK_STATUS && value === false && !failed.has(program)) {
            failed.add(program)
            const shaders = (this.getAttachedShaders(program) || []).map((s) => {
              const type = this.getShaderParameter(s, this.SHADER_TYPE) === this.VERTEX_SHADER ? 'vertex' : 'fragment'
              const log = (this.getShaderInfoLog(s) || '').trim().slice(0, 200)
              return type + ' ' + (this.getShaderSource(s) || '').length + ' chars, compiled ' + this.getShaderParameter(s, this.COMPILE_STATUS) + (log ? ', log: ' + log : '')
            })
            box.textContent += 'link failed #' + failed.size + ': ' + shaders.join('; ') + '\n'
          }
          return value
        }
        for (const kind of ['error', 'warn']) {
          const original = console[kind].bind(console)
          console[kind] = (...args) => (show(kind, args), original(...args))
        }
        addEventListener('error', (e) => show('error', [e.error ?? e.message]))
        addEventListener('unhandledrejection', (e) => show('rejection', [e.reason]))
      }
    </script>
    <div id="loading"><div>A Goose Tale</div><div class="slot"><div class="share">0 %</div></div></div>
    <script>
      // The loading screen's way out. Here and not in main.ts, since main.ts may be the file that did not come. A file
      // the game cannot start without, lost: the share gives way to the words and a key to load the page again, the run
      // kept in this tab still kept. The share standing still that long, a connection that hangs and never says so: the
      // same key under it, in case, and gone again if the share moves on.
      {
        /** How long the share may stand still, ms: past a slow connection's first files and a phone's slowest shader. */
        const STILL = 45000
        const screen = document.getElementById('loading')
        const share = screen.querySelector('.share')
        let trouble
        const tryAgain = (words) => {
          trouble?.remove()
          trouble = document.createElement('div')
          trouble.className = 'trouble'
          const said = document.createElement('div')
          said.textContent = words
          const key = document.createElement('button')
          key.className = 'enter'
          key.textContent = 'Try again'
          key.addEventListener('click', () => location.reload())
          trouble.append(said, key)
          share.parentElement.append(trouble)
          return key
        }
        // The share taken away for Enter, or the screen fading: nothing left to be stuck on.
        const loading = () => share.isConnected && !screen.classList.contains('loaded')
        let lost = false
        const fileLost = () => {
          if (lost || !loading()) return
          lost = true
          share.style.display = 'none'
          tryAgain("The game couldn't load.").focus()
        }
        // A fetch's own words, in Chrome, Firefox and Safari; three's for a file refused; a dynamic import's; an image's bare event.
        const isLostFile = (reason) => reason?.type === 'error' || /failed to fetch|networkerror|load failed|responded with|imported module|importing a module/i.test(String(reason?.message ?? reason))
        addEventListener('error', (event) => (event.target?.tagName === 'SCRIPT' || isLostFile(event.error ?? event.message)) && fileLost(), true)
        addEventListener('unhandledrejection', (event) => isLostFile(event.reason) && fileLost())
        let was = share.textContent
        let movedAt = performance.now()
        const watching = setInterval(() => {
          if (!loading()) {
            clearInterval(watching)
            trouble?.remove()
            return
          }
          if (lost) return
          const now = performance.now()
          // A page in the background draws nothing and loads little: no time of its own to count.
          if (share.textContent !== was || document.hidden) {
            was = share.textContent
            movedAt = now
            trouble?.remove()
            trouble = undefined
          } else if (!trouble && now - movedAt > STILL) {
            tryAgain('Still loading. Slow connection?')
          }
        }, 1000)
      }
    </script>
    <div id="fallen"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
